# Content-Security-Policy situs kasir (A17 hardening, 17 Okt 2026).
# Dipasang di VPS sebagai /etc/nginx/snippets/kasir-csp.conf dan disertakan di
# blok server 443 setelah kasir-keamanan.conf.
#
# Tiga hash di script-src adalah skrip cetak inline di src/lib/receipt.ts,
# src/lib/labels.ts, dan src/lib/shiftReport.ts. Struk, faktur, label, dan
# laporan shift dicetak lewat iframe tersembunyi yang mewarisi CSP halaman ini,
# jadi tanpa hash itu cetak otomatis berhenti. Mengubah skrip itu berarti
# memperbarui hash di sini; src/lib/__tests__/cspSkripCetak.test.ts menjaganya.
#
# Sumber luar: Google Sign-In (accounts.google.com), pixel TikTok, Meta, dan
# Google Ads, Google Fonts, video YouTube. Gambar produk boleh dari https mana pun
# karena alamat gambar diisi bebas oleh admin.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Oe/lWsUZSAyZFydo22r8+H/lrMTzJzzeru29D4QENLE=' 'sha256-Xuutc/oCuoQJ0p+ZYqXOQ0NjgDnlxmuxxXDOf5ZFzDc=' 'sha256-Pqs/wY3tpI47HXwlqb0xGw5jYRzSUUfQzW3UWXOcNOY=' https://accounts.google.com https://analytics.tiktok.com https://connect.facebook.net https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://accounts.google.com https://analytics.tiktok.com https://*.tiktok.com https://*.tiktokw.us https://www.facebook.com https://connect.facebook.net https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://*.doubleclick.net; frame-src 'self' https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com https://www.facebook.com https://*.doubleclick.net https://www.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-laporan" always;
